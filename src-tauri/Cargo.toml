[package]
name = "journal-reader"
version = "0.1.0"
description = "A native Linux journalctl log viewer"
authors = ["rooki"]
edition = "2021"

[lib]
name = "journal_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only include tokio features we actually use (spawn_blocking requires rt)
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# SSH support for remote log viewing
ssh2 = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
# Signal handling for graceful shutdown
ctrlc = "3"
# Host key fingerprint calculation
sha2 = "0.10"
base64 = "0.22"
